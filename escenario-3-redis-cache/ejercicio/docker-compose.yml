services:
  redis:
    image: redis:7-alpine
    container_name: redis_ej3
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data_ej3:/data
    networks:
      - app_network_ej3
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: postgres_ej3
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data_ej3:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - app_network_ej3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: app_fastapi_ej3
    restart: always
    ports:
      - "5001:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - app_network_ej3

volumes:
  redis_data_ej3:
  pg_data_ej3:

networks:
  app_network_ej3:
    driver: bridge